<!DOCTYPE html> 
<!-- Diz para o navegador que o documento está usando HTML5 -->

<html lang="pt-BR">
<!-- Abertura da página HTML, com idioma configurado como português do Brasil -->

<head>
    <!-- Cabeçalho da página: informações que não aparecem diretamente na tela -->

    <title>Lista de usuário</title>
    <!-- Define o título da aba do navegador -->

    <link rel="stylesheet" href="style.css"/> 
    <!-- Importa o arquivo CSS para estilizar a página -->
</head>

<body>
    <!-- Aqui começa o corpo da página: tudo que o usuário vê -->

    <h1>Lista de Usários</h1>
    <!-- Título principal exibido na tela -->

    <form id="form-usuario">
        <!-- Formulário com id "form-usuario" (pode ser usado pelo JavaScript) -->

        <input type="text" id="input-nome" placeholder="Digite um nome" />
        <!-- Campo de texto para digitar o nome do usuário -->
        <!-- id="input-nome" → serve para o JavaScript pegar esse campo -->
        <!-- placeholder → mostra um texto de dica dentro da caixinha -->

        <button type="submit">Adicionar usuário</button>
        <!-- Botão que envia o formulário -->
    </form>

    <ul id="lista de usuarios"></ul>
    <!-- Aqui está o erro: o id tem espaços, o que não é permitido -->
    <!-- O correto seria: <ul id="lista-de-usuarios"></ul> -->
    <!-- Essa lista servirá para mostrar os nomes adicionados -->
    <script src="script.js"></script>
</body>
</html>
