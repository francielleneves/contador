</DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Contador e Formulário</title>
    </head>
    <body>
        <h1>Contador</h1>
        <p>Valor:<span id="valor-contador">0</span></p>
        <button id="btn-subtrair">-</button>
         <button id="btn-adicionar">+</button> 
         <hr>

         <h1>Formulario de Validação</h1>
         <form id="meu-formulario">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite seu nome" />
            <br>
            <button type="submit" id="btn-enviar">Enviar</button>
         </form>
         <p id="feedback-msg"></p>
    </body>
    <script src="script.js"></script>
</html>
